<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mickey Horror Prototype</title>
    <style>
        canvas { background-color: #111; display: block; margin: 0 auto; }
    </style>
</head>
<body>
    <p id="levelText" style="color: Black; font-family: Arial; font-size: 20px; width: 600px; margin: 10px auto;">
    Welcome to the Dark City...
</p>

    <canvas id="gameCanvas" width="640" height="480"></canvas>
    <img id="donaldDead" src="dead_donald.png"
     style="position:absolute; top:0; left:0; width:640px; height:480px; display:none; z-index:10;">

    <!-- Load all level files -->
    <script src="level1.js"></script>,
    <script src="level2.js"></script>
    
    <!-- Link levels in order -->
    <script>
        // Automatically chain levels 1-20
        for(let i=1; i<=20; i++){
            const level = window['level'+i];
            const nextLevel = window['level'+(i+1)];
            if(level && nextLevel) level.nextLevel = nextLevel;
        }
    </script>
    
    <!-- Load main game logic -->
    <script src="main.js"></script>
    <script>
        startGame(); // start after levels are loaded
    </script>
</body>
</html>
